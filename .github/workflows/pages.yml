name: Build and deploy Nail Lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nail-lab-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.7"
      - name: Install editor dependencies
        run: npm install --no-audit --no-fund
      - name: Download pinned Nail 0.54, 0.60 and 0.61 runtimes
        run: npm run fetch:runtime
      - name: Build mobile PWA
        run: npm run build
      - name: Test artifacts and real Nail runtime
        run: npm test
      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium
      - name: Test mobile browser navigation
        run: npm run test:browser
      - name: Upload mobile design previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nail-lab-mobile-preview
          path: test-results/nail-lab-*.png
          if-no-files-found: ignore
      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: nail-lab-pwa
          path: dist/
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
